name: build-tvos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i tvos || true

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project _Project/Browser.xcodeproj \
            -target Browser \
            -configuration Release \
            -sdk appletvos \
            SYMROOT="$PWD/build" \
            OBJROOT="$PWD/build/obj" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            ONLY_ACTIVE_ARCH=NO 2>&1 | tail -100
          echo '--- products ---'
          find build -maxdepth 4 -name '*.app' -type d

      - name: Package zip and ipa
        run: |
          APP=$(find build -maxdepth 5 -name 'Browser.app' -type d | head -1)
          test -n "$APP"
          echo "APP=$APP"
          mkdir -p dist Payload
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/Browser-tvOS-unsigned.zip
          cp -R "$APP" Payload/Browser.app
          zip -qry dist/Browser-tvOS-unsigned.ipa Payload
          ls -la dist
          unzip -l dist/Browser-tvOS-unsigned.zip | head -8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Browser-tvOS
          path: dist/*
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" dist/Browser-tvOS-unsigned.zip dist/Browser-tvOS-unsigned.ipa --title "tvOS Browser unsigned build ${{ github.run_number }}" --notes "Unsigned build from ${{ github.sha }}. Requires your own signing before install on Apple TV." --repo "${{ github.repository }}"
